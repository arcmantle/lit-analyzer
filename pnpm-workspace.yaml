packages:
  - packages/*
  - internal/*

catalog:
  # The one TypeScript in this repository. lit-analyzer builds a Program and
  # queries the TypeChecker with it, and `packages/dev/` runs it as the host
  # compiler for dogfooding. Declared once so moving it is a one-line change.
  typescript: ^6.0.3

# `web-component-analyzer` is a workspace package now
# (ADR_5DHSRF5RQ79S7ATW8V574YDD2X), so it declares `typescript: catalog:` and
# `ts-simple-type: workspace:*` directly. The overrides that used to force those
# on the registry copy are gone with it.

allowBuilds:
  # Needed: esbuild's platform binary.
  esbuild: true
  # Both are only reached by `vsce publish`: credential storage and the
  # extension signing binary. Nothing in build, test or package needs them.
  '@vscode/vsce-sign': false
  keytar: false

# The package scripts are plain shell (`mkdir -p`, `rm -rf`, `&&`). Run them
# through pnpm's bash-like emulator so they behave the same on Windows, which CI
# builds and packages on.
shellEmulator: true
