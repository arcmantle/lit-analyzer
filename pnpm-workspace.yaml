packages:
  - packages/*

catalog:
  # The one TypeScript in this repository. lit-analyzer builds a Program and
  # queries the TypeChecker with it, and `packages/playground/` runs it as the
  # host compiler for the playground project. Declared once so moving it is a
  # one-line change.
  typescript: ^6.0.3

allowBuilds:
  # Needed: esbuild's platform binary.
  esbuild: true
  # Both are only reached by `vsce publish`: credential storage and the
  # extension signing binary. Nothing in build, test or package needs them.
  '@vscode/vsce-sign': false
  keytar: false

# The package scripts are plain shell (`mkdir -p`, `rm -rf`, `&&`). Run them
# through pnpm's bash-like emulator so they behave the same on Windows, which CI
# builds and packages on.
shellEmulator: true
